<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      安全发布会（设计文档 02）：只加载打包产物、禁止任意导航与新窗口。
      CSP 不允许放宽：
      - script-src 'self'：只跑同源打包脚本；Vite 产物用相对路径因此仍然是 'self'。
      - style-src 'unsafe-inline'：Vue 的 scoped 样式与 CodeMirror 都会注入 <style>，这个放宽是必要的。
      - connect-src 'none'：渲染层不直接联网，一切数据走 preload 白名单 IPC。
      - img-src 'self' data:：插件图标与数据 URL 缩略图。
      ⚠️ 若开 vite dev，HMR 的 WebSocket 会被 connect-src 挡掉（页面仍可用）。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>青春幻想引擎</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
